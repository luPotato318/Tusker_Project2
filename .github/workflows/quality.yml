name: Qualidade PIEM
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: npm run build:frontend
      - run: git diff --exit-code -- core/static/core/js/vendor/
      - run: npm test
      - run: python manage.py check --settings=piem.test_settings
      - run: python manage.py makemigrations --check --dry-run --settings=piem.test_settings
      - run: python manage.py test --settings=piem.test_settings
      - run: python manage.py collectstatic --noinput --settings=piem.test_settings
